services:
  # ---------------------------------------------------------
  #  MySQL Database
  # ---------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: metal-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: metal_exchange
      MYSQL_USER: metal
      MYSQL_PASSWORD: metal
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - metalnet

  # ---------------------------------------------------------
  #  Redis
  # ---------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: metal-redis
    ports:
      - "6379:6379"
    networks:
      - metalnet

  # ---------------------------------------------------------
  #  Elasticsearch
  # ---------------------------------------------------------
  elastic:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.0
    container_name: metal-elastic
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
      xpack.security.enabled: "false"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
      - "9300:9300"
    networks:
      - metalnet

  # ---------------------------------------------------------
  #  Soketi - WebSockets
  # ---------------------------------------------------------
  soketi:
    image: quay.io/soketi/soketi:1.0-16-alpine
    container_name: metal-soketi
    environment:
      SOKETI_DEFAULT_APP_ID: "metal-app"
      SOKETI_DEFAULT_APP_KEY: "app-key"
      SOKETI_DEFAULT_APP_SECRET: "app-secret"
    ports:
      - "6001:6001"
    networks:
      - metalnet

  # ---------------------------------------------------------
  #  Laravel App (PHP-FPM)
  # ---------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: metal-app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - composer_cache:/root/.composer
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "php artisan migrate:status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - metalnet

  # ---------------------------------------------------------
  #  Queue Worker (waits for app health)
  # ---------------------------------------------------------
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: metal-queue
    restart: unless-stopped
    command: sh -c "php artisan queue:work --verbose --tries=3 --queue=default"
    volumes:
      - .:/var/www/html
      - composer_cache:/root/.composer
    depends_on:
      app:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - metalnet

  # ---------------------------------------------------------
  #  Nginx
  # ---------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: metal-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      app:
        condition: service_healthy
    networks:
      - metalnet

volumes:
  mysql_data:
  es_data:
  composer_cache:

networks:
  metalnet:
    driver: bridge
